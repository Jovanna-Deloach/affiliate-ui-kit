<style>
  /* The workshop stage is white. Components keep their three planes
     (canvas → surface → recessed); the "Stage" toolbar switches the page
     plane back to the vertical's canvas when you need to judge contrast. */
  html,
  body,
  .sb-show-main {
    background: #ffffff !important;
  }
  [data-stage="white"],
  [data-stage="white"] [data-vertical] {
    background-color: var(--surface-primary);
  }
</style>
<style>
  /* Docs pages (src/storybook/docs): a contents list with nothing to list is not shown. */
  .sbdocs-toc--custom:not(:has(.toc-list-item)) {
    visibility: hidden;
  }
</style>
